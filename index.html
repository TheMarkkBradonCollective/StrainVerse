    <title>StrainVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* StrainVerse — Verdant Soft */
        --bg-main: #F3F8F4;
        --bg-card: #FFFFFF;
        --bg-input: #E7F0EA;
        --bg-hover: #DDE8E1;
        --bg-elevated: #FFFFFF;

        --text-main: #12261C;
        --text-secondary: #3A5648;
        --text-muted: #6B8578;

        --border: #D5E4DA;
        --border-strong: #A9C4B5;

        --forest-green: #1B5C3A;
        --leaf-mint: #7BCFA0;
        --sativa-sky: #C8E6F5;
        --indica-blush: #F3D9C8;
        --hybrid-mist: #D8F0E4;
        --concentrate-gold: #C9A227;
        --concentrate-gold-deep: #9A7B1A;
        --concentrate-mist: #F3E7C4;
        --sunset-hybrid: #E07A5F;
        --indica-purple: #6B5B8A;

        --accent: #1B5C3A;
        --accent-hover: #147848;
        --accent-soft: rgba(27, 92, 58, 0.12);
        --accent-light: rgba(27, 92, 58, 0.08);
        --form-hero: var(--hybrid-mist);

        --font-heading: 'Syne', sans-serif;
        --font-body: 'Outfit', sans-serif;

        --radius-lg: 1.5rem;
        --radius-xl: 1.75rem;
        --radius-pill: 9999px;

        --shadow-soft: 0 12px 40px rgba(18, 38, 28, 0.08);
        --shadow-card: 0 8px 28px rgba(18, 38, 28, 0.06);
        --shadow-color: rgba(27, 92, 58, 0.22);

        --gradient-main: linear-gradient(135deg, #1B5C3A 0%, #2A8F5C 45%, #7BCFA0 100%);
        --gradient-hero: radial-gradient(ellipse at 20% 0%, rgba(123, 207, 160, 0.35) 0%, transparent 55%),
                          radial-gradient(ellipse at 90% 10%, rgba(200, 230, 245, 0.45) 0%, transparent 45%),
                          radial-gradient(ellipse at 70% 90%, rgba(243, 217, 200, 0.35) 0%, transparent 50%);
      }

      /* Strain profile — Concentrate mode shifts accents to gold */
      .strain-profile[data-form="concentrate"] {
        --accent: var(--concentrate-gold-deep);
        --accent-hover: #7A6110;
        --accent-soft: rgba(201, 162, 39, 0.18);
        --accent-light: rgba(201, 162, 39, 0.1);
        --shadow-color: rgba(154, 123, 26, 0.28);
        --form-hero: var(--concentrate-mist);
        --bg-input: #F5EDD8;
        --border: #E5D6A8;
        --border-strong: #C9B56A;
      }

      .strain-profile[data-form="flower"] {
        --form-hero: var(--hybrid-mist);
      }

      .strain-profile[data-form="flower"][data-type="sativa"] {
        --form-hero: var(--sativa-sky);
      }

      .strain-profile[data-form="flower"][data-type="indica"] {
        --form-hero: var(--indica-blush);
      }

      .strain-profile[data-form="flower"][data-type="hybrid"] {
        --form-hero: var(--hybrid-mist);
      }

      @keyframes drift-soft {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(2%, -1.5%, 0) scale(1.04); }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes float-y {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }

      @keyframes breathe-scale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      .fade-in-up {
        animation: fadeInUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .float-y {
        animation: float-y 5s ease-in-out infinite;
      }

      body {
        font-family: var(--font-body);
        background-color: var(--bg-main);
        background-image: var(--gradient-hero);
        background-attachment: fixed;
        color: var(--text-main);
        -webkit-font-smoothing: antialiased;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 8c-4 8-12 14-18 16 6 2 14 8 18 16 4-8 12-14 18-16-6-2-14-8-18-16z' fill='%231B5C3A' fill-opacity='1'/%3E%3C/svg%3E");
        background-size: 72px 72px;
      }

      #root {
        position: relative;
        z-index: 1;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-heading);
        letter-spacing: -0.02em;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      .neon-text-glow {
        color: var(--accent);
      }

      .sv-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-card);
      }

      .sv-pill {
        border-radius: var(--radius-pill);
      }

      .sv-cta {
        background: var(--accent);
        color: #fff;
        border-radius: var(--radius-pill);
        font-weight: 700;
        transition: background 0.2s ease, transform 0.15s ease;
      }
      .sv-cta:hover {
        background: var(--accent-hover);
      }
      .sv-cta:active {
        transform: scale(0.98);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Profile Standard Styles */
      .ys-profile-root {
        background: transparent;
        color: var(--text-main);
        font-family: var(--font-body);
      }
      .ys-header {
        border-bottom: 1px solid var(--border);
      }
      .ys-name {
        color: var(--text-main);
        font-family: var(--font-heading);
        font-weight: 800;
      }
      .ys-avatar {
        border: 3px solid var(--border-strong);
        box-shadow: var(--shadow-soft);
      }
      .ys-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        margin-bottom: 1.5rem;
        box-shadow: var(--shadow-card);
      }
      .ys-widget-title {
        color: var(--text-secondary);
        text-transform: uppercase;
        font-weight: 700;
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
      }
      .ys-bio {
        color: var(--text-muted);
        font-size: 0.95rem;
        line-height: 1.6;
      }
    </style>
